<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debrief Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c2410c'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f6; --surface: #ffffff; --surface-2: #eef2f2; --text: #142423; --muted: #5a6b6a;
    --line: #dbe3e2; --primary: #0d7f76; --primary-soft: #dcf1ee; --on-primary: #ffffff;
    --accent: #c2410c; --danger: #c62828; --ok: #1f7a4d; --warn: #9a5b00; --hot: #e03131;
    --ring: #0d9488; --shadow: 0 1px 2px rgba(16,40,38,.06), 0 4px 16px rgba(16,40,38,.06);
    --radius: 10px; --ease: cubic-bezier(.2,.8,.2,1);
    --s-event: #ffb366; --s-command: #8ecbff; --s-actor: #fff08a; --s-policy: #d7b8f3; --s-readmodel: #b8e6b8;
    --s-system: #ffc0d9; --s-aggregate: #ffe066; --s-hotspot: #ff8a8a; --s-text: #1d1d1d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1716; --surface: #172221; --surface-2: #1f2d2b; --text: #e6efee; --muted: #9db1af;
      --line: #2b3b39; --primary: #3cc4b6; --primary-soft: #193d39; --on-primary: #06201d;
      --accent: #fb923c; --danger: #f28b82; --ok: #6fd3a0; --warn: #f0b862; --hot: #ff6b6b;
      --ring: #5eead4; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --s-event: #e8a15a; --s-command: #7ab6e6; --s-actor: #e6d870; --s-policy: #bf9fdc; --s-readmodel: #9fcf9f;
      --s-system: #e6a8c1; --s-aggregate: #e6c94f; --s-hotspot: #f07575;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column;
         font: 14.5px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  svg.i { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  a { color: var(--primary); }

  header { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 54px; flex-wrap: wrap;
           background: var(--surface); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; }
  header h1 .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36vw; }
  header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px;
          border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.rec { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
  .pill.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
  .pill.busy { color: var(--warn); }
  @keyframes pulse { 50% { opacity: .3; } }
  .meta { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 10px; align-items: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
         padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
         font-weight: 500; white-space: nowrap; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
  .btn.ghost { border-color: transparent; background: none; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn.sm { min-height: 28px; padding: 0 8px; font-size: 12.5px; border-radius: 6px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .icon-btn { width: 32px; height: 32px; padding: 0; border-radius: 7px; border: 0; background: none; color: var(--muted);
              display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .input, .textarea, select.input { width: 100%; min-height: 36px; padding: 6px 10px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--surface); }
  .textarea { resize: vertical; min-height: 70px; }
  .input:focus, .textarea:focus { outline: 2px solid var(--ring); outline-offset: -1px; border-color: transparent; }
  label.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
          animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Three columns; on narrow screens tabs */
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.15fr) minmax(380px, 1.6fr); }
  .col { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--surface); }
  .col:last-child { border-right: 0; background: var(--bg); }
  .col > h2 { margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
              color: var(--muted); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .col > h2 .spacer { flex: 1; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .mtabs { display: none; }
  @media (max-width: 1100px) {
    .cols { grid-template-columns: 1fr; }
    .col { display: none; border-right: 0; }
    .col.show { display: flex; }
    .mtabs { display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 8px; }
    .mtabs button { border: 0; background: none; padding: 10px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
    .mtabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
    header h1 .ttl { max-width: 60vw; }
  }

  /* Transcript */
  #transcript { padding: 8px 14px 40px; }
  .blk { margin: 10px 0; }
  .blk .who .ex { margin-left: auto; border: 0; background: none; padding: 2px 4px; color: var(--muted); opacity: .35; border-radius: 6px; line-height: 0; }
  .blk:hover .who .ex, .blk .who .ex:focus-visible, .blk.out .who .ex { opacity: 1; }
  .blk .who .ex:hover { color: var(--text); }
  .ln.out { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); opacity: .6; }
  .mute-note { margin: 0; padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border-bottom: 1px solid var(--line); }
  .pill.off { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
  .blk .who { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; }
  .blk .who button { border: 0; background: none; padding: 0; font-weight: 700; color: var(--primary); }
  .blk .who button.ph { color: var(--warn); text-decoration: underline dotted; }
  .blk .who time { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .ln { display: inline; }
  .ln.unconf { color: var(--muted); font-style: italic; }
  .ln.hl { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; }
  .ln .nr { font-size: 10px; color: var(--muted); vertical-align: super; margin-right: 2px; opacity: .6; }
  #to-end { position: sticky; bottom: 10px; margin-left: auto; display: block; }
  .empty { padding: 28px 18px; color: var(--muted); text-align: center; }

  /* Assistant */
  #steer { padding: 10px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #steer form { display: flex; gap: 6px; align-items: center; }
  #steer .opts { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 99px; font-size: 12.5px;
          background: var(--surface-2); border: 1px solid var(--line); }
  .chip.fact { background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .chip .icon-btn { width: 22px; height: 22px; }
  .chip .i { width: 13px; height: 13px; }
  details.facts summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .ftabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .ftabs button { border: 0; background: none; padding: 9px 8px; font-weight: 600; font-size: 13px; color: var(--muted);
                  border-bottom: 2px solid transparent; white-space: nowrap; }
  .ftabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .ftabs .n:empty { display: none; }
  .noteform { display: flex; gap: 6px; margin-top: 6px; }
  header h1 a.ttl { color: inherit; text-decoration: none; }
  header h1 a.ttl:hover { text-decoration: underline; }
  .board > .empty { max-width: 520px; text-align: left; }
  .ftabs .n { font-size: 11px; background: var(--surface-2); border-radius: 99px; padding: 0 6px; margin-left: 4px; }
  .sec { padding: 6px 12px 12px; }
  .sec h3 { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 10px 2px 6px; }
  .entry { border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; margin-bottom: 8px; background: var(--surface);
           transition: box-shadow .3s, border-color .3s; }
  .entry.top { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); box-shadow: var(--shadow); }
  .entry.fresh { animation: fresh 3s var(--ease); }
  @keyframes fresh { 0% { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); } 100% { background: var(--surface); } }
  .entry.flash { border-color: var(--hot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--hot) 30%, transparent); }
  .entry.done { opacity: .7; }
  .entry .head { display: flex; gap: 6px; align-items: center; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .entry .typ { text-transform: uppercase; letter-spacing: .04em; }
  .entry .typ.frage { color: var(--primary); } .entry .typ.annahme { color: var(--warn); }
  .entry .typ.offen { color: var(--accent); } .entry .typ.code { color: #6d5bd0; }
  .entry .hs { background: var(--hot); color: #fff; border-radius: 99px; padding: 0 6px; cursor: pointer; border: 0; font-size: 11px; font-weight: 700; }
  .entry .txt { font-weight: 600; margin: 3px 0 2px; }
  .entry .why { font-size: 12.5px; color: var(--muted); }
  .entry .refs { font-size: 11.5px; display: inline-flex; gap: 4px; }
  .entry .refs button { border: 0; background: none; color: var(--primary); padding: 0; font-size: 11.5px; }
  .entry .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .entry .note { font-size: 12.5px; margin-top: 4px; padding: 4px 8px; border-left: 3px solid var(--ok); background: var(--surface-2); border-radius: 0 6px 6px 0; }
  .entry .found { font-size: 12px; margin: 4px 0 0; padding-left: 16px; }
  .entry .found code { font-size: 11.5px; }
  .status-lbl { margin-left: auto; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .start { padding: 22px 18px; display: grid; gap: 10px; justify-items: start; }
  .start p { margin: 0; color: var(--muted); }
  .start .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .jobs { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; margin: 6px 2px; }
  .jobs .err { color: var(--danger); }

  /* Board */
  .ptabs { display: flex; gap: 2px; align-items: center; overflow-x: auto; padding: 0 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .ptabs button.tab { border: 0; background: none; padding: 9px 10px; font-weight: 600; font-size: 13px; color: var(--muted);
                      border-bottom: 2px solid transparent; white-space: nowrap; }
  .ptabs button.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
  .sk { display: block; height: 12px; border-radius: 6px; margin: 9px 0; background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 35%, var(--surface)) 50%, var(--line) 75%);
        background-size: 200% 100%; animation: sk 1.3s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }
  @keyframes breathe { 50% { opacity: .55; } }
  .sk-card { border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; margin-bottom: 10px; pointer-events: none; }
  .sk-board { display: flex; flex-direction: column; gap: 14px; padding: 12px 6px; }
  .sk-row { display: flex; gap: 12px; }
  .sk-row .sk { width: 132px; height: 84px; border-radius: 3px; margin: 0; }
  .sk-row .gap { width: 132px; }
  .workbar { display: flex; align-items: center; gap: 8px; padding: 0 14px 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .board-wrap.busy .sticky { animation: breathe 1.4s ease-in-out infinite; }
  .imp { font-size: 9px; letter-spacing: 1px; color: var(--accent, var(--primary)); cursor: help; }
  .imp .off { opacity: .25; }
  @media (prefers-reduced-motion: reduce) { .sk, .board-wrap.busy .sticky { animation: none; } }
  .pcmd { display: flex; gap: 6px; padding: 0 12px 8px; align-items: center; }
  .pcmd .input { flex: 1; }
  .finding { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .finding.done { opacity: .6; }
  .finding .meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .sev { padding: 1px 8px; border-radius: 999px; background: var(--surface-2, var(--bg)); }
  .sev.hoch { color: var(--danger); } .sev.mittel { color: var(--warn); }
  .finding p { margin: 6px 0; }
  .finding .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); margin-bottom: 10px; }
  .drop.over { border-color: var(--primary); color: var(--text); }
  body.solo .cols { grid-template-columns: minmax(0, 1fr); }
  body.solo .col { min-width: 0; }
  body.solo .col:not(#c-board) { display: none; }
  body.solo #c-board { display: flex; border-right: 0; }
  body.solo #mtabs, body.solo #h-ctrl, body.solo #b-ctx, body.solo #b-model, body.solo #b-attach, body.solo #h-meta, body.solo #b-popout { display: none !important; }
  .btools { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; align-items: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 0 12px 6px; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  .props { margin: 0 12px 8px; display: grid; gap: 6px; }
  .prop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 10px; border-radius: 8px; font-size: 13px;
          border: 1px dashed var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
  .prop .x { flex: 1; min-width: 180px; }
  .board-wrap { flex: 1; min-height: 0; overflow: auto; position: relative; padding: 4px 12px 30px; }
  .board { display: grid; gap: 10px 12px; position: relative; align-items: center; width: max-content; min-width: 100%; }
  .lane-lbl { font-size: 12px; font-weight: 700; color: var(--muted); writing-mode: horizontal-tb; position: sticky; left: 0; z-index: 2;
              background: var(--bg); padding: 4px 6px; border-right: 2px solid var(--line); align-self: stretch; display: flex; align-items: center; width: 110px; overflow-wrap: anywhere; hyphens: auto; }
  .lane-bg { grid-column: 1 / -1; align-self: stretch; border-bottom: 1px dashed var(--line); pointer-events: none; }
  .seg-head { align-self: end; justify-self: stretch; text-align: left; border: 0; border-bottom: 2px solid var(--primary); background: none;
              padding: 4px 2px; font-size: 12px; font-weight: 700; color: var(--primary); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell { min-width: 132px; min-height: 84px; border-radius: 6px; }
  .cell.drop { outline: 2px dashed var(--ring); outline-offset: -4px; }
  .sticky { width: 132px; min-height: 84px; padding: 6px 8px 8px; border-radius: 3px; color: var(--s-text); position: relative; z-index: 1;
            box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.08); cursor: grab; font-size: 12.5px; line-height: 1.3;
            border: 2px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 3px; }
  .sticky:active { cursor: grabbing; }
  .sticky .k { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; opacity: .65; display: flex; gap: 4px; align-items: center; }
  .sticky .k .i { width: 11px; height: 11px; margin-left: auto; }
  .sticky.actor { width: 96px; min-height: 56px; }
  .sticky.assumed { border: 2px dashed rgba(0,0,0,.45); }
  .sticky.mine { box-shadow: 0 0 0 2px var(--primary), 0 3px 8px rgba(0,0,0,.1); }
  .sticky.flash { box-shadow: 0 0 0 4px var(--hot); }
  .sticky .hot { position: absolute; top: -8px; right: -8px; display: flex; gap: 2px; }
  .sticky .hot button { min-width: 20px; height: 20px; border-radius: 99px; border: 2px solid var(--bg); background: var(--hot); color: #fff;
                        font-size: 10.5px; font-weight: 800; padding: 0 5px; }
  .sticky.event { background: var(--s-event); } .sticky.command { background: var(--s-command); }
  .sticky.actor { background: var(--s-actor); } .sticky.policy { background: var(--s-policy); }
  .sticky.readmodel { background: var(--s-readmodel); } .sticky.system { background: var(--s-system); }
  .sticky.aggregate { background: var(--s-aggregate); } .sticky.hotspot { background: var(--s-hotspot); transform: rotate(-2deg); }
  .add-cell { width: 40px; height: 40px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); }
  .add-cell:hover { color: var(--primary); border-color: var(--primary); }
  svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 0; }
  svg.links path { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: .75; }

  dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow);
           width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); }
  dialog::backdrop { background: rgba(10,20,20,.4); }
  dialog .dh { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  dialog .dh h2 { margin: 0; font-size: 16px; flex: 1; }
  dialog .db { padding: 4px 16px 16px; overflow-y: auto; max-height: calc(100dvh - 170px); }
  dialog .df { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  dialog .df .left { margin-right: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .list { display: grid; gap: 4px; }
  .list label, .list button.li { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 13.5px;
                                 border: 0; background: none; text-align: left; width: 100%; }
  .list label:hover, .list button.li:hover { background: var(--surface-2); }
  .list .sub { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .repo { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 4px 4px 4px 10px; background: var(--surface-2); border-radius: 6px; margin-bottom: 4px; }
  .repo code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spk-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .picker { max-width: 640px; margin: 30px auto; padding: 0 16px; width: 100%; }
  .picker h2 { font-size: 20px; }
  .mt { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius);
        background: var(--surface); margin-bottom: 8px; text-align: left; }
  .mt:hover { border-color: var(--primary); }
  .mt-wrap { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  .mt-wrap .mt { margin-bottom: 0; }
  .cont { align-self: flex-start; }
  .rec-sep { margin: 16px 0 4px; padding: 4px 0; border-top: 1px dashed var(--line); font-size: 11.5px; font-weight: 700; letter-spacing: .04em;
             text-transform: uppercase; color: var(--muted); }
  .mt .t { font-weight: 600; flex: 1; }

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = name => `<svg class="i" aria-hidden="true"><use href="#i-${name}"/></svg>`;

// ---------- Language: German texts are the keys, EN in i18n.js ----------
const LANGS = ["de", "en"];
function storeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } }
let LANG = (() => { const saved = storeGet("lang"); return LANGS.includes(saved) ? saved : (navigator.language || "de").toLowerCase().startsWith("en") ? "en" : "de"; })();
function t(key, vars) {
  if (key == null) return key;
  let s = (LANG === "en" && EN[key]) || (LANG === "de" && DE[key]) || key.replace(/@@.*$/, "");
  if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
  return s;
}
function translateStatic() {
  const tr = de => { const k = de.trim(); return k && LANG === "en" && EN[k] ? EN[k] : null; };
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const parent = node.parentElement;
    if (!parent || parent.closest("[data-dyn], script, style, svg")) continue;
    node.__de ??= node.nodeValue;
    const en = tr(node.__de);
    node.nodeValue = en ? node.__de.replace(node.__de.trim(), en) : node.__de;
  }
  for (const el of $$("[title], [placeholder], [aria-label]")) {
    if (el.closest("[data-dyn]")) continue;
    for (const attr of ["title", "placeholder", "aria-label"]) {
      if (!el.hasAttribute(attr)) continue;
      el.__deAttr ??= {};
      el.__deAttr[attr] ??= el.getAttribute(attr);
      el.setAttribute(attr, tr(el.__deAttr[attr]) ?? el.__deAttr[attr]);
    }
  }
  document.documentElement.lang = LANG;
  $$("#lang-toggle button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.lang === LANG)));
}
function setLang(l) { if (l === LANG) return; LANG = l; storeSet("lang", l); translateStatic(); renderAll(); }

const TYPES = ["event", "command", "actor", "policy", "readmodel", "system", "aggregate", "hotspot"];
const TYPE_NAME = { event: "Domain Event", command: "Command", actor: "Akteur", policy: "Policy", readmodel: "Read Model",
                    system: "Externes System", aggregate: "Aggregat", hotspot: "Hotspot" };
const ENTRY_NAME = { frage: "Frage", annahme: "Annahme", offen: "Offener Punkt", code: "Code" };
const STATUS_NAME = { neu: "neu", angepinnt: "angepinnt", gestellt: "gestellt", beantwortet: "beantwortet", verworfen: "verworfen",
                      stimmt: "stimmt", stimmt_nicht: "stimmt nicht", erledigt: "erledigt" };
const OPEN = new Set(["neu", "angepinnt", "gestellt"]);

let sid = location.hash.slice(1) || null;
// The process alone in its own window (?nur=prozess): same session, same live updates, only the board
const SOLO = new URLSearchParams(location.search).get("nur") === "prozess";
if (SOLO) document.body.classList.add("solo");
let S = null, META = {}, LABELS = {};
const LINES = new Map();
const ui = { filter: storeGet("live-filter") || "fragen", proc: null, col: "c-assist", seen: null, noteFor: null, follow: true };
let events = null, retryMs = 2000, pickerTimer = null, pendingRender = false;
const autoJumped = new Set();  // jump to a running recording once, not again after going back to the list

// ---------- Helpers ----------
async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(t(data.fehler || res.statusText)), { data });
  return data;
}
const post = (action, body = {}) => api(`/api/live/${sid}/${action}`, body);
let toastTimer;
function toast(html, err = false) {
  const el = $("#toast");
  el.innerHTML = html; el.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = "", err ? 6000 : 3500);
}
async function act(fn) { try { await fn(); } catch (e) { toast(esc(e.message), true); } }
const loc = () => LANG === "en" ? "en-GB" : "de-DE";
const fmtTime = d => d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit", second: "2-digit" });
function lineTime(z) { return new Date(new Date(S.start).getTime() + z.start_ms); }
function speakerName(spk) { const lab = LABELS[spk] ?? "?"; return S?.sprecher_namen?.[lab] || lab; }
const isPlaceholder = lab => /^(Speaker \d+( \(\d+\))?|Microphone|\?)$/.test(lab);
function closeOnBackdrop(d) { d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) d.close(); }); }
$$("dialog").forEach(closeOnBackdrop);

// ---------- Meeting picker ----------
async function showPicker() {
  $("#picker").hidden = false; $("#cols").hidden = true; $("#mtabs").hidden = true;
  ["#b-ctx", "#b-model", "#b-attach", "#h-state"].forEach(s => $(s).hidden = true);
  $("#h-title").textContent = ""; $("#h-meta").textContent = ""; $("#h-ctrl").innerHTML = "";
  const load = async () => {
    try {
      const { meetings } = await api("/api/live/meetings");
      const running = meetings.find(m => m.laeuft);
      // a new recording that looks like the continuation of a session is offered as such instead of jumping in
      if (running && !running.fortsetzung_von && !autoJumped.has(running.id)) { autoJumped.add(running.id); location.hash = running.id; return; }
      $("#pk-list").innerHTML = meetings.length ? meetings.map(m => `<div class="mt-wrap">
        <button class="mt" data-id="${m.id}">
          ${m.laeuft ? `<span class="pill rec">${t("läuft")}</span>` : ""}
          <span class="t">${esc(m.titel)}<br><span class="s">${esc(new Date(m.start).toLocaleString(loc(), { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))}
            · ${esc(m.app || "")} · ${t("{n} Zeilen", { n: m.zeilen })}${m.sitzung ? " · " + t("schon ausgewertet") : ""}</span></span>
        </button>${m.fortsetzung_von ? `<button class="btn sm primary cont" data-cont="${m.fortsetzung_von.id}" data-new="${m.id}">${icon("link")} ${t("Weiter in: {x}", { x: esc(m.fortsetzung_von.titel) })}</button>` : ""}</div>`).join("") : `<p class="empty">${t("Noch keine Aufnahmen in MacWhisper.")}</p>`;
      $$("#pk-list .mt").forEach(b => b.onclick = () => location.hash = b.dataset.id);
      $$("#pk-list .cont").forEach(b => b.onclick = () => act(async () => {
        await api(`/api/live/${b.dataset.cont}/aufnahme-anhaengen`, { id: b.dataset.new });
        location.hash = b.dataset.cont;
      }));
    } catch (e) { $("#pk-list").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
  };
  await load();
  clearInterval(pickerTimer);
  pickerTimer = setInterval(load, 4000);
}

// ---------- Session ----------
async function openSession(id) {
  clearInterval(pickerTimer);
  events?.close();
  LINES.clear(); S = null; ui.seen = null; ui.proc = null;
  $("#picker").hidden = true; $("#cols").hidden = false; $("#mtabs").hidden = false;
  try {
    const data = await api(`/api/live/${id}`);
    META = data; LABELS = data.sprecher;
    data.zeilen.forEach(z => LINES.set(z.id, z));
    S = data.sitzung;
    autoJumped.add(id);
    renderAll();
    connectEvents();
  } catch (e) { toast(esc(e.message), true); sid = null; location.hash = ""; }
}
function connectEvents() {
  events = new EventSource(`/api/live/${sid}/events`);
  events.addEventListener("zeilen", e => {
    const d = JSON.parse(e.data);
    LABELS = d.sprecher;
    (d.entfernt || []).forEach(id => LINES.delete(id));
    d.zeilen.forEach(z => LINES.set(z.id, z));
    renderTranscript();
  });
  events.addEventListener("sitzung", e => { S = JSON.parse(e.data); scheduleRender(); });
  events.onopen = () => { retryMs = 2000; };
  events.onerror = e => {
    if (e.target.readyState !== EventSource.CLOSED) return;
    setTimeout(() => { if (sid && !document.hidden && events?.readyState === EventSource.CLOSED) connectEvents(); }, retryMs);
    retryMs = Math.min(retryMs * 2, 15000);
  };
}
// A browser allows 6 connections per address and every open tab keeps one for its live updates: with many tabs
// the page freezes because new requests wait forever. So background tabs let go and catch up when shown again.
document.addEventListener("visibilitychange", async () => {
  if (document.hidden) { events?.close(); events = null; return; }

// ---------- Transcript ----------
let transcriptFrame = 0;
const PARAGRAPH_PAUSE_MS = 4000, PARAGRAPH_MAX_MS = 60000;
// What the assistant listens to: lines in a muted range or from a muted speaker are shown struck through
// and never reach the analysis (the server filters the same way).
function isOut(z) {
  const lab = LABELS[z.sprecher] ?? "?";
  return (S?.stumm || []).includes(lab) || (S?.ausgenommen || []).some(r => z.start_ms >= r.von_ms && (r.bis_ms == null || z.start_ms < r.bis_ms));

const isMuted = () => (S?.ausgenommen || []).some(r => r.bis_ms == null);
function renderTranscript() {

    const box = $("#t-scroll");
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const lines = [...LINES.values()].sort((a, b) => a.nr - b.nr || a.start_ms - b.start_ms);
    const hl = new Set(ui.highlightLines || []);
    // A new paragraph per speaker change, after a pause or every few minutes, so a single-speaker
    // recording does not become one wall of text.
    const blocks = [];
    let cur = null, blockStart = 0, prevEnd = 0;
    for (const z of lines) {
      const pause = z.start_ms - prevEnd >= PARAGRAPH_PAUSE_MS || z.start_ms - blockStart >= PARAGRAPH_MAX_MS;
      prevEnd = Math.max(prevEnd, z.ende_ms);
      if (!cur || z.sprecher !== cur.spk || pause || z.rec !== cur.rec) {
        cur = { spk: z.sprecher, rec: z.rec, lines: [], repeat: !!cur && z.sprecher === cur.spk && z.rec === cur.rec, newRec: !!cur && z.rec !== cur.rec };
        blocks.push(cur);
        blockStart = z.start_ms;
      }
      cur.lines.push(z);
    }
    let out = 0;
    const html = blocks.map(b => {
      const first = b.lines[0], off = b.lines.every(isOut);
      const lab = LABELS[b.spk] ?? "?", name = speakerName(b.spk);
      const von = first.start_ms, bis = b.lines.at(-1).start_ms + 1;
      const label = off ? t("Wieder auswerten") : t("Nicht auswerten");
      const ex = `<button class="ex" data-von="${von}" data-bis="${bis}" data-ex="${off ? "" : "1"}" title="${esc(label)}" aria-label="${esc(label)}">${icon(off ? "eye" : "eye-off")}</button>`;
      const head = b.repeat ? `<time>${fmtTime(lineTime(first))}</time>`
        : `<button class="${isPlaceholder(name) ? "ph" : ""}" data-label="${esc(lab)}" title="${esc(t("Sprecher benennen"))}">${esc(name)}</button><time>${fmtTime(lineTime(first))}</time>`;
      const body = b.lines.map(z => {
        const o = isOut(z); if (o) out++;
        return `<span class="ln${z.bestaetigt ? "" : " unconf"}${o ? " out" : ""}${hl.has(z.nr) ? " hl" : ""}" id="z${z.nr}"><span class="nr">${z.nr}</span>${esc(z.text)} </span>`;
      }).join("");
      const sep = b.newRec ? `<div class="rec-sep">${t("Aufnahme {n}", { n: b.rec + 1 })} · ${esc((S.aufnahmen || [])[b.rec - 1]?.titel || "")}</div>` : "";
      return `${sep}<div class="blk${off ? " out" : ""}"><div class="who">${head}${ex}</div>${body}</div>`;
    }).join("");
    $("#transcript").innerHTML = html || `<p class="empty">${S?.laeuft ? t("Warte auf die ersten Sätze …") : t("Noch nichts zu sehen.")}</p>`;
    $("#t-count").textContent = lines.length ? t("{n} Zeilen", { n: lines.length }) + (out ? " · " + t("{n} nicht ausgewertet", { n: out }) : "") : "";

    $$("#transcript .who .ex").forEach(b => b.onclick = () => act(() => post("ausnehmen", { von_ms: Number(b.dataset.von), bis_ms: Number(b.dataset.bis), ausnehmen: !!b.dataset.ex })));
    if (atEnd && ui.follow) box.scrollTop = box.scrollHeight;

}

// ---------- Entries ----------
const FILTERS = [

function hotspotNumbers() {
  // Numbers shared by the board and the list: open entries that point at elements
  const nums = {};

  for (const e of S.eintraege || []) if (OPEN.has(e.status) && e.elemente?.length) nums[e.id] = ++n;

  if (e.zeilen?.length && curLast >= 0) s += 1.5 / (1 + Math.max(0, curLast - Math.max(...e.zeilen)) / 40);  // still being discussed

  if (e.zeilen?.length && curLast - Math.max(...e.zeilen) < 40) why.push(t("gerade im Gespräch"));
  if (e.quelle === "ich") why.push(t("von dir"));
  return `<span class="imp" title="${esc(`${t("Wichtigkeit")}: ${t(["niedrig", "mittel", "hoch"][l - 1])} · ${why.join(" · ")}`)}">${"●".repeat(l)}<span class="off">${"●".repeat(3 - l)}</span></span>`;
}
const sk = w => `<span class="sk" style="width:${w}"></span>`;
const skCard = (cls = "") => `<article class="sk-card ${cls}" aria-hidden="true">${sk("28%")}${sk("96%")}${sk("78%")}${sk("52%")}</article>`;

// ---------- Board (event storming) ----------
// With several processes the board starts with the big picture: all of them on one time line, every actor in

const ALL = "*";
function currentProc() {
  const procs = S.prozesse || [];
  if (ui.proc === ALL && procs.length > 1) return combinedProc(procs);
  if (!procs.find(p => p.id === ui.proc)) ui.proc = procs.length > 1 ? ALL : procs[0]?.id || null;
  return ui.proc === ALL ? combinedProc(procs) : procs.find(p => p.id === ui.proc) || null;
}
function combinedProc(procs) {

    id: ALL, name: t("Gesamtbild"), alle: true,
    elemente: procs.flatMap(p => p.elemente.map(e => ({ ...e, prozess: p.id }))),
    verbindungen: procs.flatMap(p => p.verbindungen),
    segmente: procs.map(p => ({ id: p.id, name: p.name, n: p.elemente.length })),

}
const ownerOf = id => (S.prozesse || []).find(p => p.elemente.some(e => e.id === id));
// the process new elements go to: the open one, in the big picture the last one

function drawLinks(p) {
  const svg = $("#links");
  if (!svg) return;
  const box = $("#board").getBoundingClientRect();
  svg.setAttribute("width", box.width); svg.setAttribute("height", box.height);
  // explicit connections solid; the time line between neighbours that are not connected explicitly dotted
  const out = new Set(p.verbindungen.map(v => v.von)), inc = new Set(p.verbindungen.map(v => v.nach));
  const pairs = [...p.verbindungen.map(v => [v.von, v.nach, false]),
    ...p.elemente.slice(1).map((e, i) => [p.elemente[i], e]).filter(([a, b]) => a.prozess === b.prozess)
      .map(([a, b]) => [a.id, b.id, true]).filter(([a, b]) => !out.has(a) && !inc.has(b))];
  svg.innerHTML = pairs.map(([a, b, dashed]) => {
    const ea = $(`[data-el="${a}"]`), eb = $(`[data-el="${b}"]`);
    if (!ea || !eb) return "";
    const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
    const x1 = ra.right - box.left, y1 = ra.top + ra.height / 2 - box.top, x2 = rb.left - box.left, y2 = rb.top + rb.height / 2 - box.top;
    const dx = Math.max(24, Math.abs(x2 - x1) / 2);
    return `<path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2 - 6},${y2}" ${dashed ? 'stroke-dasharray="3 4"' : ""} marker-end="url(#arr)"/>`;
  }).join("") + `<defs><marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs>`;
}
window.addEventListener("resize", () => { const p = S && currentProc(); if (p) drawLinks(p); });
function flashElements(ids) {

}

let miroAfterLogin = null;
// OAuth: the login opens in a small window (it must open on the click itself, or the popup blocker stops it);
// the callback page reports back with postMessage and the transfer continues.
function miroLogin(then) {
  miroAfterLogin = then;
  const w = window.open("/miro/login", "miro-login", "width=640,height=760");
  if (!w) toast(t("Das Login-Fenster wurde blockiert – bitte Pop-ups für diese Seite erlauben."), true);
}
window.addEventListener("message", e => {
  if (e.data !== "miro-verbunden" || !/^http:\/\/([\w-]+\.)?(localhost|127\.0\.0\.1)(:\d+)?$/.test(e.origin)) return;
  META.miro_verbunden = true;
  toast(t("Mit Miro verbunden"));
  const next = miroAfterLogin; miroAfterLogin = null;
  if (next) next();
});
function miroSync(askBoard = false) {
  if (!META.miro) {
    toast(t("Miro ist noch nicht eingerichtet: client_id oder Access Token unter miro: in config.yaml eintragen (siehe README)."), true);
    return;
  }
  let board = S.miro?.board ? `https://miro.com/app/board/${S.miro.board}/` : META.miro_board || "";
  if (askBoard || !board) {
    board = prompt(t("Link des Miro-Boards:"), board);
    if (!board) return;
  }
  const send = () => {
    const btn = $("#b-miro");
    btn.disabled = true;
    act(async () => {
      try {
        const r = await post("miro", { board });
        toast(`${t("Nach Miro übertragen")} · <a href="${esc(r.url)}" target="_blank" rel="noopener">${t("Board öffnen")}</a>`);
      } catch (e) {
        if (!e.data?.login) throw e;
        META.miro_verbunden = false;
        toast(`${esc(e.message)} · <button class="btn sm" id="miro-relogin">${t("Mit Miro verbinden")}</button>`, true);
        $("#miro-relogin").onclick = () => miroLogin(send);
      } finally { btn.disabled = false; }
    });
  };
  if (META.miro_oauth && !META.miro_verbunden) miroLogin(send);
  else send();
}
$("#b-miro").onclick = () => miroSync();

  };
  $("#spk-body").innerHTML = labels.length ? labels.map(l => `<div class="spk-row"><b>${esc(l)}</b><input class="input" data-spk="${esc(l)}" list="dl-names" value="${esc(S.sprecher_namen[l] || "")}" placeholder="${esc(isPlaceholder(l) ? t("Name") : l)}"></div>
      <div style="margin:-4px 0 10px 128px"><p class="hint" style="margin:0 0 4px">${esc(sample(l))}</p>
        <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-listen="${esc(l)}" ${(S.stumm || []).includes(l) ? "" : "checked"}> ${t("Beiträge auswerten")}</label></div>`).join("") : `<p class="hint">${t("Noch keine Sprecher erkannt.")}</p>`;
  $("#d-spk").showModal();
  ($(`[data-spk="${CSS.escape(focusLabel || "")}"]`) || $("[data-spk]"))?.focus();
}
$("#spk-save").onclick = () => act(async () => {
  for (const inp of $$("[data-spk]")) {
    const name = inp.value.trim();
    if (name !== (S.sprecher_namen[inp.dataset.spk] || "")) await post("sprecher", { label: inp.dataset.spk, name });
  }
  for (const cb of $$("[data-listen]")) {
    if (cb.checked === (S.stumm || []).includes(cb.dataset.listen)) await post("sprecher-stumm", { label: cb.dataset.listen, stumm: !cb.checked });
  }
  $("#d-spk").close();
  renderTranscript();
});

// ---------- Model ----------
$("#b-model").onclick = () => act(async () => {
  const data = await api("/api/live/modelle");
  const m = S.modell;
  const opts = (weg, sel) => (weg === "gateway" ? data.gateway.map(x => x.id) : data.direkt).map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
  const render = weg => {
    $("#model-body").innerHTML = `
      <label class="lbl">${t("Weg")}</label>
      <div class="list"><label><input type="radio" name="weg" value="direkt" ${weg === "direkt" ? "checked" : ""}> claude -p ${t("(dein Claude-Abo)")}</label>
        <label><input type="radio" name="weg" value="gateway" ${weg === "gateway" ? "checked" : ""} ${META.gateway ? "" : "disabled"}> ${t("LiteLLM-Gateway")} ${META.gateway ? "" : `<span class="sub">${t("nicht konfiguriert")}</span>`}</label></div>
      <div class="row2"><div><label class="lbl" for="m-a">${t("Gesprächsanalyse")}</label><select class="input" id="m-a">${opts(weg, m.analyse)}</select></div>
        <div><label class="lbl" for="m-r">${t("Code-Recherche")}</label><select class="input" id="m-r">${opts(weg, m.recherche)}</select></div></div>
      <p class="hint">${t("Die Analyse läuft im Takt ohne Werkzeuge; die Recherche liest mit Read/Grep/Glob nur in den gewählten Repositories.")}</p>
      <label style="display:flex;gap:6px;margin-top:10px;font-size:13.5px"><input type="checkbox" id="m-def"> ${t("Als Standard für neue Sitzungen")}</label>`;
    $$("input[name=weg]").forEach(r => r.onchange = () => render(r.value));
  };
  render(m.weg === "gateway" && META.gateway ? "gateway" : "direkt");
  $("#d-model").showModal();
});
$("#model-save").onclick = () => act(async () => {
  await post("modell", { weg: $("input[name=weg]:checked").value, analyse: $("#m-a").value, recherche: $("#m-r").value, standard: $("#m-def").checked });
  $("#d-model").close();
});

// ---------- Columns on small screens ----------
function showCol(id) {
  if (SOLO) id = "c-board";
  ui.col = id;
  $$(".col").forEach(c => c.classList.toggle("show", c.id === id));
  $$("#mtabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.col === id)));
  if (id === "c-board" && S) requestAnimationFrame(() => { const p = currentProc(); if (p) drawLinks(p); });
}
$$("#mtabs button").forEach(b => b.onclick = () => showCol(b.dataset.col));

// ---------- Start ----------
$$("#lang-toggle button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
function route() {
  const id = location.hash.slice(1);
  if (id && id === sid && S) return;
  sid = id || null;
  if (sid) openSession(sid).then(() => SOLO && showCol("c-board")); else { events?.close(); S = null; showPicker(); }
}
window.addEventListener("hashchange", route);
translateStatic();
route();
</script>
</body>
</html>
