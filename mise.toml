# Tools for the Debrief: `mise install` in the project folder
[tools]
uv = "latest"
# Universal binary (arm64 + x86_64) straight from the GitHub release
"github:julienXX/terminal-notifier" = "3.1.0"
jq = "latest"  # for `mise run status`
node = "lts"  # for `mise run lint`

[env]
DEBRIEF_LABEL = "de.{{ exec(command='id -un') }}.debrief"

# Tasks: `mise run <name>`, or `mise tasks` for an overview

[tasks.install]
description = "Install tools, set up the launchd service and (re)start it"
run = "./install.sh"

[tasks.uninstall]
description = "Remove the launchd service (files and suggestions are kept)"
run = "./install.sh uninstall"

[tasks.restart]
description = "Restart the service and wait until the review page answers, e.g. after changes to server.py, debrief.py or config.yaml"
shell = "bash -c"
run = '''
launchctl kickstart -k "gui/$(id -u)/$DEBRIEF_LABEL" 2>/dev/null \
  || { echo "Dienst nicht installiert – erst: mise run install" >&2; exit 1; }
port=$(sed -n 's/^ *port: *\([0-9]*\).*/\1/p' config.yaml | head -1)
for _ in $(seq 30); do
  curl -sf -o /dev/null "http://127.0.0.1:${port:-8765}/api/state" && { echo "neu gestartet"; exit 0; }
  sleep 0.5
done
echo "Neu gestartet, aber nach 15 s noch nicht erreichbar – letzte Log-Zeilen:" >&2
tail -n 20 debrief.log launchd.log >&2
exit 1
'''

[tasks.status]
description = "Show whether the service is running, and the open suggestions"
shell = "bash -c"
run = '''
if launchctl print "gui/$(id -u)/$DEBRIEF_LABEL" 2>/dev/null | grep -E "^\s+(state|pid) ="; then :; else echo "Dienst nicht installiert"; fi
port=$(sed -n 's/^ *port: *\([0-9]*\).*/\1/p' config.yaml | head -1)
if state=$(curl -sf "http://127.0.0.1:${port:-8765}/api/state"); then
  jq -r 'if .items == [] then "  keine offenen Vorschläge" else .items[] | "  \(.status)\t\(.datei)" end' <<<"$state"
else
  echo "Server nicht erreichbar"
fi
'''

[tasks.open]
description = "Open the review page in the browser"
shell = "bash -c"
run = '''
host=$(sed -n 's/^ *host: *\([^ #]*\).*/\1/p' config.yaml | head -1)
port=$(sed -n 's/^ *port: *\([0-9]*\).*/\1/p' config.yaml | head -1)
open "http://${host:-127.0.0.1}:${port:-8765}/"
'''

[tasks.test]
description = "Run the tests"
run = "uv run --no-project --with pytest --with pyyaml python -m pytest -q tests"

[tasks.lint]
description = "Lint the review page (static/)"
shell = "bash -c"
run = "{ [ node_modules -nt package-lock.json ] || npm ci --silent; } && npx eslint static"

[tasks.check]
description = "Lint and tests – runs before every commit once `mise run hooks` is set up"
depends = ["lint", "test"]

[tasks.hooks]
description = "Enable the pre-commit hook (.githooks/pre-commit)"
run = "git config core.hooksPath .githooks"

[tasks.logs]
description = "Follow the logs live"
run = "tail -n 50 -F debrief.log launchd.log"

[tasks.dev]
description = "Run the server in the foreground (the service is paused meanwhile and restarted afterwards)"
shell = "bash -c"
run = '''
plist="$HOME/Library/LaunchAgents/$DEBRIEF_LABEL.plist"
if launchctl bootout "gui/$(id -u)/$DEBRIEF_LABEL" 2>/dev/null; then
  trap 'launchctl bootstrap "gui/$(id -u)" "$plist" && echo "Dienst wieder gestartet"' EXIT
  echo "Dienst angehalten"
fi
uv run --script server.py
'''

[tasks.calendar-access]
description = "Request or check calendar access for the helper app"
shell = "bash -c"
run = '''
out=$(mktemp); open -W -n --stdout "$out" "$PWD/bin/Debrief Calendar.app" --args --auth; cat "$out"; rm -f "$out"
'''

[tasks.dry-run]
description = "Analyze the inbox and only show the result, without writing anything"
run = "uv run --script debrief.py --dry-run"

[tasks.sort]
description = "Direct mode: file everything in the inbox immediately, without review"
run = "uv run --script debrief.py"
