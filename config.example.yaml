# Path to the Obsidian vault
vault: ~/Documents/Obsidian Vault

# Folder where MacWhisper puts the transcripts (relative to the vault)
inbox: transkripts

# Your full name, as it appears as a speaker in the transcript (a first name alone also matches every
# colleague with that first name)
ich: Max Mustermann

# Optional: your role, helps the model classify (e.g. "consultant at Acme")
#rolle: Beraterin bei Acme

# Model for `claude -p` (alias like `sonnet` or a full model ID). Without `gateway` your regular
# Claude subscription is used – the transcripts then go to Anthropic.
model: sonnet

# Optional: LiteLLM-compatible gateway (e.g. company-owned, with internally hosted models) so that
# conversation content stays in-house. The model list then appears under "Settings → Model".
#gateway:
#  base_url: https://llm-gateway.example.com/
#  # API key, one of three variants:
#  #   token_cmd: command that prints the key (recommended, e.g. keychain/password manager)
#  #   token_env: name of an environment variable (note: launchd does not see your shell variables)
#  #   token:     the key itself (then do not commit config.yaml)
#  token_cmd: security find-generic-password -s llm-gateway -w

# Below this confidence the note goes to `unklar_ordner` instead of the customer
min_konfidenz: 0.6
unklar_ordner: Transkripte/_Unklar

# Language of notifications and the review page on first load: de or en
# (the page itself can be switched at the top right and remembers the choice)
sprache: de

# Review UI (server.py): new transcripts are only filed after confirmation
review:
  # Address of the page: http://<host>:<port>/ – *.localhost points to this machine without any setup
  host: debrief.localhost
  port: 8765
  # On a new suggestion: false = notification (click opens the page), true = open the browser tab directly.
  # If the page is currently open, neither happens (it refreshes itself).
  auto_open: false
  # Turn off notifications entirely (e.g. for a test server)
  mitteilung: true

# Recordings with fewer words count as a test and are not analyzed (on the page: discard / analyze anyway)
min_woerter: 30

# Wikilinks to customer, project, person and attendees at the top of every note
links: true

# Duplicate transcripts (similarity 0–1 to inbox and filed notes; same recording time+duration counts as 0.9)
duplikate:
  automatisch_ab: 0.9   # from here: automatically to the trash (restorable under Settings → Duplicates)
  pruefen_ab: 0.5       # from here: do not analyze, show as "Duplicate?" for a decision instead

# Calendar event at recording time (macOS Calendar) as context: title, organizer, invitees
kalender: true
# An event qualifies if the recording starts between vor_beginn_min before and nach_beginn_min after its
# start – or if it is already running when the recording starts
kalender_fenster:
  vor_beginn_min: 10
  nach_beginn_min: 30

# The categories live in categories.yaml (also editable via the review page)

# Folders with older transcripts for "Import" on the review page
import:
  ordner:
    - ~/Desktop/Whisper
