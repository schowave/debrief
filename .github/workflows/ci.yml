name: CI

# Lint and tests (`mise run check`, the same as the pre-commit hook). Renovate
# automerges its update PRs only when this passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only what lint and tests need; terminal-notifier and jq are for the local service.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: uv node ruff
      - run: mise run setup
      - run: mise run check
