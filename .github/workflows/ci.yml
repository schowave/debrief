name: CI

# Lint and tests (`mise run check`, the same as the pre-commit hook). Renovate
# automerges its update PRs only when this passes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only what lint and tests need; terminal-notifier and jq are for the local service.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: uv node ruff
      - run: mise run setup
      - run: mise run check
